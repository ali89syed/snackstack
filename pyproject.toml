[project]
name = "snackstack"
version = "0.1.0"
description = "Multi-agent food delivery assistant built with LangGraph"
readme = "README.md"
authors = [
    { name = "Ali Syed", email = "38336893+ali89syed@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
]

[project.scripts]
snackstack = "snackstack.main:main"
snackstack-voice = "snackstack.voice:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
