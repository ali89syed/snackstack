<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1120" viewBox="0 0 1100 1120" role="img" aria-labelledby="title desc">
  <title id="title">SnackStack architecture</title>
  <desc id="desc">An orchestrator routes each message to the menu agent, the order agent, or both. Each agent runs a tool loop of up to five rounds: the menu agent searches ChromaDB, the order agent looks up orders. The order agent pauses with interrupt() when an ID is missing. A synthesizer merges the answers before text or voice output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5E9A95"/>
    </marker>
  </defs>

  <rect width="1100" height="1120" rx="28" fill="#1F2226"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Header -->
    <text x="60" y="66" font-size="38" font-weight="700" fill="#ECEAE5">SnackStack</text>
    <text x="60" y="94" font-size="15" fill="#9CA3AB">Layered intelligence for food · agent architecture</text>
    <rect x="60" y="110" width="56" height="4" rx="2" fill="#5E9A95"/>

    <!-- Input -->
    <rect x="400" y="140" width="300" height="44" rx="22" fill="#5E9A95"/>
    <text x="550" y="167" font-size="15" font-weight="600" fill="#1F2226" text-anchor="middle">Text or voice in</text>
    <path d="M550 184 V240" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="566" y="222" font-size="12" fill="#9CA3AB">voice: mic → VAD → Whisper STT</text>

    <!-- Orchestrator -->
    <rect x="390" y="240" width="320" height="60" rx="12" fill="#2B3035" stroke="#5E9A95" stroke-width="2"/>
    <text x="550" y="266" font-size="17" font-weight="700" fill="#ECEAE5" text-anchor="middle">Orchestrator</text>
    <text x="550" y="287" font-size="12" fill="#9CA3AB" text-anchor="middle">structured output → RouteDecision</text>

    <!-- Send() fan-out -->
    <path d="M550 300 V330 H270 V380" fill="none" stroke="#5E9A95" stroke-width="2" marker-end="url(#arrow-teal)"/>
    <path d="M550 330 H830 V380" fill="none" stroke="#5E9A95" stroke-width="2" marker-end="url(#arrow-teal)"/>
    <text x="550" y="352" font-size="13" font-weight="600" fill="#A9CBC7" text-anchor="middle">Send() · one or both agents</text>

    <!-- Menu lane -->
    <rect x="150" y="380" width="240" height="60" rx="12" fill="#33393F" stroke="#5E9A95" stroke-width="2"/>
    <text x="270" y="406" font-size="17" font-weight="700" fill="#ECEAE5" text-anchor="middle">Menu Agent</text>
    <text x="270" y="427" font-size="12" fill="#9CA3AB" text-anchor="middle">RAG over the menu</text>
    <path d="M270 440 V575" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <polygon points="270,575 345,610 270,645 195,610" fill="#2B3035" stroke="#9CA3AB" stroke-width="1.5"/>
    <text x="270" y="614" font-size="12" fill="#ECEAE5" text-anchor="middle">LLM: tool call?</text>
    <path d="M270 645 V680" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="278" y="667" font-size="12" fill="#9CA3AB">tool</text>
    <rect x="150" y="680" width="240" height="48" rx="10" fill="#2E5F5C" stroke="#5E9A95" stroke-width="1.5"/>
    <text x="270" y="709" font-size="14" font-family="Consolas, Menlo, monospace" fill="#ECEAE5" text-anchor="middle">search_menu_catalog</text>
    <path d="M150 704 H120 V610 H195" fill="none" stroke="#5E9A95" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-teal)"/>
    <text x="108" y="664" font-size="11" fill="#A9CBC7" text-anchor="end">≤ 5 loops</text>
    <path d="M270 728 V770" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M170 782 A100 12 0 0 1 370 782 V828 A100 12 0 0 1 170 828 Z" fill="#3A4047" stroke="#9CA3AB" stroke-width="1.5"/>
    <ellipse cx="270" cy="782" rx="100" ry="12" fill="none" stroke="#9CA3AB" stroke-width="1.5"/>
    <text x="270" y="812" font-size="13" fill="#ECEAE5" text-anchor="middle">ChromaDB · RAG</text>

    <!-- Order lane -->
    <rect x="710" y="380" width="240" height="60" rx="12" fill="#33393F" stroke="#5E9A95" stroke-width="2"/>
    <text x="830" y="406" font-size="17" font-weight="700" fill="#ECEAE5" text-anchor="middle">Order Agent</text>
    <text x="830" y="427" font-size="12" fill="#9CA3AB" text-anchor="middle">regex ID extraction</text>
    <path d="M830 440 V465" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <polygon points="830,465 905,500 830,535 755,500" fill="#2B3035" stroke="#9CA3AB" stroke-width="1.5"/>
    <text x="830" y="504" font-size="12" fill="#ECEAE5" text-anchor="middle">ID in message?</text>
    <path d="M830 535 V575" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="838" y="559" font-size="12" fill="#9CA3AB">found</text>
    <polygon points="830,575 905,610 830,645 755,610" fill="#2B3035" stroke="#9CA3AB" stroke-width="1.5"/>
    <text x="830" y="614" font-size="12" fill="#ECEAE5" text-anchor="middle">LLM: tool call?</text>
    <path d="M830 645 V680" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="838" y="667" font-size="12" fill="#9CA3AB">tool</text>
    <rect x="710" y="680" width="240" height="48" rx="10" fill="#2E5F5C" stroke="#5E9A95" stroke-width="1.5"/>
    <text x="830" y="709" font-size="14" font-family="Consolas, Menlo, monospace" fill="#ECEAE5" text-anchor="middle">get_order_status</text>
    <path d="M950 704 H1010 V610 H905" fill="none" stroke="#5E9A95" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-teal)"/>
    <text x="1018" y="664" font-size="11" fill="#A9CBC7">≤ 5 loops</text>
    <path d="M830 728 V770" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M730 782 A100 12 0 0 1 930 782 V828 A100 12 0 0 1 730 828 Z" fill="#3A4047" stroke="#9CA3AB" stroke-width="1.5"/>
    <ellipse cx="830" cy="782" rx="100" ry="12" fill="none" stroke="#9CA3AB" stroke-width="1.5"/>
    <text x="830" y="812" font-size="13" fill="#ECEAE5" text-anchor="middle">orders.json</text>

    <!-- Human-in-the-loop: missing ID -->
    <path d="M755 500 H645" fill="none" stroke="#A9CBC7" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)"/>
    <text x="700" y="492" font-size="11" fill="#9CA3AB" text-anchor="middle">no ID</text>
    <text x="700" y="521" font-size="11" fill="#9CA3AB" text-anchor="middle">reply → resume</text>
    <rect x="475" y="470" width="170" height="60" rx="30" fill="#2B3035" stroke="#A9CBC7" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="560" y="496" font-size="14" font-weight="700" fill="#ECEAE5" text-anchor="middle">interrupt()</text>
    <text x="560" y="516" font-size="12" fill="#9CA3AB" text-anchor="middle">asks user for ID</text>

    <!-- Answers into the synthesizer -->
    <path d="M345 610 H460 V860" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="400" y="602" font-size="11" fill="#9CA3AB" text-anchor="middle">answer</text>
    <path d="M755 610 H640 V860" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="700" y="602" font-size="11" fill="#9CA3AB" text-anchor="middle">answer</text>

    <!-- Synthesizer, end, output -->
    <rect x="430" y="860" width="240" height="60" rx="12" fill="#2B3035" stroke="#5E9A95" stroke-width="2"/>
    <text x="550" y="886" font-size="17" font-weight="700" fill="#ECEAE5" text-anchor="middle">Synthesizer</text>
    <text x="550" y="906" font-size="12" fill="#9CA3AB" text-anchor="middle">merges one or both answers</text>
    <path d="M550 920 V950" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="490" y="950" width="120" height="36" rx="18" fill="#5E9A95"/>
    <text x="550" y="973" font-size="14" font-weight="700" fill="#1F2226" text-anchor="middle">END</text>
    <path d="M550 986 V1030" fill="none" stroke="#9CA3AB" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="360" y="1030" width="380" height="44" rx="22" fill="#5E9A95"/>
    <text x="550" y="1057" font-size="15" font-weight="600" fill="#1F2226" text-anchor="middle">Text or voice out · streaming TTS</text>

    <!-- Notes and legend -->
    <rect x="60" y="940" width="300" height="60" rx="10" fill="none" stroke="#5C646D" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="76" y="964" font-size="12" fill="#9CA3AB">MemorySaver: one thread per conversation</text>
    <text x="76" y="984" font-size="12" fill="#9CA3AB">reset starts a new thread</text>
    <text x="1040" y="965" font-size="12" fill="#9CA3AB" text-anchor="end">solid = always · dashed = conditional or human</text>
  </g>
</svg>
